{{define "content"}}{{with .Data}}
<h1 class="h2">Store a secret</h1>
<p class="text-secondary">The value goes to this computer's secret store and is never shown again.</p>
{{template "err" .Err}}
<form method="post" action="/secrets" enctype="multipart/form-data" autocomplete="off">
  <input type="hidden" name="csrf" value="{{$.CSRF}}">
  <div class="mb-3"><label class="form-label" for="secret-name">Name</label>
    <input class="form-control" id="secret-name" name="name" value="{{.Name}}" required pattern="[A-Z][A-Z0-9_]{0,62}" placeholder="IMPR_NOTARY_KEY"></div>
  <div class="mb-3"><label class="form-label" for="secret-value">Value</label>
    <textarea class="form-control font-monospace" id="secret-value" name="value" rows="6" spellcheck="false"></textarea></div>
  <div class="mb-3"><label class="form-label" for="secret-file">or a file (an App Store Connect .p8 key)</label>
    <input class="form-control" id="secret-file" name="file" type="file"></div>
  <button type="submit" class="btn btn-primary">{{icon "lock"}}<span class="ms-1">Store</span></button>
  <a href="/secrets" class="btn btn-link">Cancel</a>
</form>
{{end}}{{end}}
